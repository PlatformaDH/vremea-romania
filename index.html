<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vremea în România</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="stil.css" />
  </head>
  <body>
    <div class="fundal" aria-hidden="true"></div>
    <main class="cadran">
      <header class="antet">
        <div>
          <p class="eticheta" id="eticheta">România</p>
          <h1 id="titlu-localitate">Alege localitatea</h1>
        </div>
        <p class="ora" id="ora-locala">—</p>
      </header>

      <form class="alegere" id="form-locatie">
        <label>
          Județ
          <select id="judet" name="judet" required></select>
        </label>
        <label>
          Localitate
          <input
            id="filtru-localitate"
            type="search"
            placeholder="Caută în județ"
            autocomplete="off"
          />
          <select id="localitate" name="localitate" required></select>
        </label>
      </form>

      <section class="acum" id="panou-acum" aria-live="polite">
        <p class="stare" id="stare">Se încarcă vremea…</p>
      </section>

      <section class="detalii" id="detalii" hidden></section>
      <section class="ore" id="ore" hidden>
        <h2>Următoarele ore</h2>
        <div class="banda" id="banda-ore"></div>
      </section>
      <section class="zile" id="zile" hidden>
        <h2>Prognoză pe 7 zile</h2>
        <ul class="lista-zile" id="lista-zile"></ul>
      </section>
    </main>
    <script src="aplicatie.js"></script>
  </body>
</html>
